<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Merge Sort Challenge</title>

<link rel="stylesheet"
href="merge.css">

</head>

<body>
    <div class="gold-bg">

<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>
<div class="gold-particle"></div>

</div>

<!-- LOGIN CHECK -->

<script>

if(
!localStorage.getItem(
"currentUser"
)
){

window.location.href =
"index.html";
}

</script>

<!-- LOGOUT -->

<button class="logout-btn"
onclick="logout()">

🚪 Logout

</button>

<!-- TITLE -->

<h1>

🌳 Merge Sort Challenge

</h1>

<!-- TOP BAR -->

<div class="top-bar">

<div class="card">

<h2 id="phase">

Phase: Splitting

</h2>

</div>

<div class="card">

<h2 id="accuracy">

Accuracy: 100%

</h2>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<label>

Array Size

</label>

<input
type="number"
id="arraySize"
min="4"
max="8"
value="8">

<label>

Max Value

</label>

<input
type="number"
id="maxValue"
min="20"
max="100"
value="50">

<button onclick="startGame()">

🎮 Generate Array

</button>

</div>

<!-- MESSAGE -->

<div id="message">

Split arrays into single values

</div>

<!-- TREE CONTAINER -->

<div id="treeContainer">

</div>

<!-- SOUNDS -->

<audio id="correctSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"
type="audio/mpeg">

</audio>

<audio id="wrongSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"
type="audio/mpeg">

</audio>

<audio id="winSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"
type="audio/mpeg">

</audio>

<!-- SCRIPT -->

<script src="merge.js"></script>

</body>
</html>
