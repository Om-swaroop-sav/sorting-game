🫧 Bubble Sort Tutorial
</h1>

<div class="tutorial-card">

<h2>
How Bubble Sort Works
</h2>

<p>
Bubble Sort compares nearby values.
</p>

<p>
If LEFT value is bigger, SWAP.
</p>

<p>
Larger values move to the right side.
</p>

</div>

<!-- EXAMPLE -->

<div class="example-box">

<div class="example-bar active"
style="height:180px;">

50

</div>

<div class="example-bar active"
style="height:120px;">

20

</div>

<div class="example-bar"
style="height:220px;">

80

</div>

<div class="example-bar"
style="height:90px;">

10

</div>

</div>

<div class="instruction">

50 is bigger than 20,
so they should swap.

</div>
