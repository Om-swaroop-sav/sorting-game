<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bubble Sort Learning Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <button class="logout-btn"
onclick="logout()">

🚪 Logout

</button>
<div class="background-bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div class="bubbles"></div>

<h1>🫧 Bubble Sort Learning Game</h1>

<div class="top-panel">

    <div class="card">
        <h2 id="pass">
            Pass: 1
        </h2>
    </div>

    <div class="card">
        <h2 id="accuracy">
            Accuracy: 100%
        </h2>
    </div>

    <div class="card">
        <h2 id="stars">
            ⭐⭐⭐
        </h2>
    </div>

</div>

<div class="size-box">

    <label>Array Size:</label>

    <input
        type="range"
        id="sizeSlider"
        min="5"
        max="12"
        value="8">

    <span id="sizeValue">8</span>

</div>

<div class="message-box">

    <h2 id="message">
        Compare the highlighted bars
    </h2>

</div>

<div id="array-container"></div>

<div class="buttons">

    <button onclick="makeMove(true)">
        🔁 Swap
    </button>

    <button onclick="makeMove(false)">
        ⏭ Skip
    </button>

    <button onclick="newGame()">
        🎲 New Game
    </button>

</div>

<div class="hint-box">

    💡 Bubble Sort swaps only if
    the left value is bigger.

</div>

<audio id="correctSound">
    <source
    src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
    type="audio/mpeg">
</audio>
<!-- SOUNDS -->

<audio id="correctSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"
type="audio/mpeg">

</audio>

<audio id="wrongSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"
type="audio/mpeg">

</audio>

<audio id="winSound">

<source
src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"
type="audio/mpeg">

</audio>
<script src="script.js"></script>

</body>
</html>
