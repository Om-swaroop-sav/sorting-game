🟪 Insertion Sort Tutorial
</h1>

<div class="tutorial-card">

<h2>
How Insertion Sort Works
</h2>

<p>

Insertion Sort takes one value
at a time and inserts it into
the correct sorted position.

</p>

<p>

The left side becomes sorted
step by step.

</p>

</div>

<!-- EXAMPLE -->

<div class="example-box">

<div class="example-bar correct"
style="height:90px;">

10

</div>

<div class="example-bar correct"
style="height:140px;">

20

</div>

<div class="example-bar correct"
style="height:220px;">

50

</div>

<div class="example-bar active"
style="height:170px;">

30

</div>

</div>

<div class="instruction">

30 should be inserted
before 50.

</div>
