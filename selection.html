<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Selection Sort Game</title>

    <link rel="stylesheet"
          href="selection.css">

</head>

<body>
    <div class="bg-lines">

<div class="line horizontal1"></div>

<div class="line horizontal2"></div>

<div class="line vertical1"></div>

<div class="line diagonal1"></div>

<div class="line diagonal2"></div>

</div>
    <button class="logout-btn"
onclick="logout()">

🚪 Logout

</button>

<!-- BACKGROUND -->

<div class="scanner-bg">

    <div class="scan-line"></div>

</div>

<h1>
    🔍 Selection Sort Challenge
</h1>

<!-- TOP PANEL -->

<div class="top-panel">

    <div class="card">

        <h2>
            🎯 Goal
        </h2>

        <p>
            Find the minimum value
        </p>

    </div>

    <div class="card">

        <h2 id="moves">
            Moves: 0
        </h2>

    </div>

    <div class="card">

        <h2 id="accuracy">
            Accuracy: 100%
        </h2>

    </div>

</div>

<!-- MESSAGE -->

<div id="message"
     class="message-box">

    🔍 Select the minimum value.

</div>

<!-- POINTERS -->

<div class="pointer-info">

    <span id="iPointer">

        i = 0

    </span>

    <span id="minPointer">

        min = 0

    </span>

</div>

<!-- ARRAY -->
<!-- CONTROLS -->

<div class="controls">

<label>

Array Size

</label>

<input type="number"
id="arraySize"
min="4"
max="15"
value="8">

<label>

Max Value

</label>

<input type="number"
id="maxValue"
min="20"
max="300"
value="100">

<button onclick="generateArray()">

🔄 Generate

</button>

</div>
<div id="array-container">

</div>

<!-- BUTTON -->



</div>

<!-- SOUNDS -->

<audio id="correctSound">

    <source
    src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"
    type="audio/mpeg">

</audio>

<audio id="wrongSound">

    <source
    src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"
    type="audio/mpeg">

</audio>

<script src="selection.js"></script>

</body>
</html>
